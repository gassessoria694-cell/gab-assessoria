<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno | GAB Assessoria</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #1e3c72;
            text-align: center;
            font-size: 24px;
        }
        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        label {
            font-weight: 600;
            color: #444;
            display: block;
            margin-bottom: 6px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #2a5298;
            outline: none;
            box-shadow: 0 0 5px rgba(42, 82, 152, 0.3);
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            background: #1e3c72;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #2a5298;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>GAB Assessoria</h2>
        <p>Preencha os dados abaixo para enviar o seu pedido.</p>
        
        <!-- Altere o código abaixo substituindo pelo seu link do Formspree após a ativação -->
        <form action="https://formspree.io/f/xyekloed" method="POST">
            
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="Nome Completo" placeholder="Digite seu nome" required>

            <label for="whatsapp">WhatsApp com DDD:</label>
            <input type="tel" id="whatsapp" name="WhatsApp" placeholder="(00) 00000-0000" required>

            <label for="pedido">Seu Pedido (Mensagem):</label>
            <textarea id="pedido" name="Detalhes do Pedido" placeholder="Descreva aqui o suporte ou serviço que você precisa..." required></textarea>

            <button type="submit">Enviar Pedido</button>
        </form>
    </div>

</body>
</html>
